<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ASMRゲーム(寛成さん作)</title>
<style>
  :root{
    --main:#ffd6ff;
    --sub:#dcffff;
    --skin:#f6bd8a;
    --skin-dark:#e8a468;
    --hair:#e8b23d;
    --hair-dark:#d69a24;
    --lip:#ff7a52;
    --lip-dark:#e85f3a;
    --blush:#ff9ec2;
    --top:#ff9ecb;
    --top-dark:#f07ab3;
    --ink:#4a3b3b;
    --wood:#c68a52;
    --wood-dark:#96602f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--sub),var(--main) 70%);
    background-size:200% 200%;
    animation:bgshift 14s ease-in-out infinite;
    user-select:none;
    touch-action:none;
  }
  @keyframes bgshift{
    0%,100%{background-position:0% 0%;}
    50%{background-position:100% 100%;}
  }
  #app{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1.5rem;
    z-index:1;
  }
  .screen[hidden]{display:none;}

  /* ---- ふわふわ背景の飾り(キラキラ+くだもの) ---- */
  .bgdeco{
    position:fixed;
    pointer-events:none;
    font-size:1.5rem;
    opacity:.5;
    animation:float 9s ease-in-out infinite;
    z-index:0;
  }
  @keyframes float{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-26px) rotate(15deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }

  /* ---- タイトル/クリア共通の見出し ---- */
  h1,h2{
    color:#c9548a;
    text-shadow:0 2px 0 #fff, 0 4px 10px rgba(200,90,140,.25);
    margin:0 0 .3rem;
  }
  h1{font-size:2rem;}
  h2{font-size:2.1rem;}
  .screen p{
    margin:0 0 1.4rem;
    font-size:1rem;
    color:#7c5a6b;
  }
  .gal-preview{
    width:min(58vw,240px);
    height:auto;
    filter:drop-shadow(0 8px 14px rgba(180,110,60,.25));
    margin-bottom:1.2rem;
  }
  .stage-hint{
    font-size:.85rem;
    color:#a5789a;
    margin:-.8rem 0 1.2rem;
  }
  button.big{
    font-size:1.25rem;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#ff9ecb,#ff7ab0);
    border:none;
    border-radius:999px;
    padding:.9rem 2.2rem;
    box-shadow:0 6px 0 #e0568f, 0 10px 18px rgba(224,86,143,.35);
    cursor:pointer;
    transition:transform .08s ease;
  }
  button.big:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #e0568f, 0 4px 10px rgba(224,86,143,.35);
  }

  /* ---- ゲーム画面 ---- */
  #gameScreen{padding:0;justify-content:flex-start;}
  #hud{
    position:fixed;
    top:0;left:0;right:0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:.4rem .6rem;
    padding:.7rem 1rem;
    z-index:5;
  }
  #hudStage,#hudCount{
    font-weight:bold;
    color:#c9548a;
    background:#fff;
    border-radius:999px;
    padding:.15rem .7rem;
    font-size:.9rem;
    box-shadow:0 2px 6px rgba(120,80,100,.15);
    white-space:nowrap;
  }
  #hudBar{
    width:min(56vw,260px);
    height:1.1rem;
    background:rgba(255,255,255,.6);
    border-radius:999px;
    overflow:hidden;
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(120,80,100,.15);
  }
  #hudFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff9ecb,#ffd166);
    transition:width .35s cubic-bezier(.3,1.6,.5,1);
    border-radius:999px;
  }

  #galWrap{
    position:fixed;
    left:50%;
    top:46%;
    transform:translate(-50%,-52%);
    width:min(86vw,420px);
    pointer-events:none;
    z-index:2;
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translate(-50%,-52%);}
    50%{transform:translate(-50%,calc(-52% - 6px));}
  }
  #galSvg{width:100%;height:auto;display:block;overflow:visible;}
  #mouthGroup{
    transform-box:fill-box;
    transform-origin:center;
    transition:transform .08s ease;
  }
  #mouthGroup.chomp{
    animation:chomp .32s ease;
  }
  @keyframes chomp{
    0%{transform:scaleY(1);}
    35%{transform:scaleY(.25);}
    65%{transform:scaleY(1.15);}
    100%{transform:scaleY(1);}
  }

  /* ---- テーブルとお皿 ---- */
  #tableWrap{
    position:fixed;
    left:0;right:0;bottom:0;
    height:clamp(96px,15vh,140px);
    background:linear-gradient(180deg,var(--wood),var(--wood-dark) 75%);
    border-top:6px solid #7f4f24;
    box-shadow:0 -8px 18px rgba(70,40,10,.25), inset 0 6px 10px rgba(255,255,255,.12);
    z-index:4;
    display:flex;
    align-items:flex-start;
    justify-content:space-evenly;
    padding:10px 8px 0;
  }
  .plate{
    width:clamp(42px,16vw,66px);
    height:clamp(42px,16vw,66px);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffffff,#f1eee8 60%,#d9d3c6 100%);
    border:3px solid #fff;
    box-shadow:0 5px 8px rgba(60,30,5,.3), inset 0 0 0 6px rgba(0,0,0,.05);
    margin-top:-16px;
    flex-shrink:0;
  }

  #foodLayer{
    position:fixed;
    inset:0;
    z-index:6;
  }
  .food{
    position:fixed;
    font-size:clamp(2rem,8vw,2.9rem);
    line-height:1;
    filter:drop-shadow(0 6px 8px rgba(120,80,60,.25));
    cursor:grab;
    touch-action:none;
    animation:pop-in .28s cubic-bezier(.3,1.7,.4,1), wiggle 2.4s ease-in-out infinite .28s;
    will-change:transform;
  }
  .food.dragging{
    cursor:grabbing;
    animation:none !important;
    scale:1.15;
    filter:drop-shadow(0 10px 14px rgba(120,80,60,.35));
    z-index:7;
  }
  .food.eaten{
    animation:eaten-pop .28s ease forwards !important;
    pointer-events:none;
  }
  @keyframes pop-in{
    0%{transform:scale(0) rotate(-20deg);opacity:0;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }
  @keyframes eaten-pop{
    0%{transform:scale(1);opacity:1;}
    100%{transform:scale(0.1);opacity:0;}
  }

  .particle{
    position:fixed;
    font-size:1.3rem;
    pointer-events:none;
    z-index:8;
    animation:burst .6s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:var(--dx) scale(.4);opacity:0;}
  }

  .confetti{
    position:fixed;
    font-size:1.6rem;
    top:-2rem;
    pointer-events:none;
    z-index:9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(112vh) rotate(360deg);opacity:.2;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル画面 -->
  <section id="titleScreen" class="screen">
    <h1>ASMRゲーム</h1>
    <p>テーブルのおさらから ゆびで おかずを つまんで<br>おくちに はこんであげよう♪</p>
    <svg id="galPreview" class="gal-preview" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="stage-hint">ぜんぶで 5ステージ あるよ</div>
    <button id="startBtn" class="big" type="button">▶ はじめる</button>
  </section>

  <!-- ゲーム画面 -->
  <section id="gameScreen" class="screen" hidden>
    <div id="hud">
      <div id="hudStage">ステージ 1</div>
      <div id="hudBar"><div id="hudFill"></div></div>
      <div id="hudCount">0 / 10</div>
    </div>
    <div id="galWrap">
      <svg id="galSvg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="foodLayer"></div>
    <div id="tableWrap"></div>
  </section>

  <!-- ステージクリア画面 -->
  <section id="stageClearScreen" class="screen" hidden>
    <h2 id="stageClearTitle">ステージ1 クリア!!</h2>
    <p>つぎのステージに ちょうせんしよう!</p>
    <button id="nextStageBtn" class="big" type="button">▶ つぎへ</button>
  </section>

  <!-- 全ステージクリア画面 -->
  <section id="finalClearScreen" class="screen" hidden>
    <h2>全ステージ クリア!! 🎉</h2>
    <p>5つの ステージを ぜんぶ クリアしたよ、すごい!</p>
    <button id="restartBtn" class="big" type="button">🔁 さいしょから あそぶ</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------
     ギャルキャラクターのSVG(おなじものを タイトル/ゲーム画面で使う)
     ※ 手描きイラストを受け取り次第、差し替え予定のプレースホルダー
  ------------------------------------------------------------ */
  function galMarkup(mouthId){
    return `
      <ellipse cx="150" cy="392" rx="120" ry="18" fill="#00000014"/>
      <path d="M55 398 C48 300 78 258 150 254 C222 258 252 300 245 398 Z" fill="var(--top)"/>
      <path d="M55 398 C48 300 78 258 150 254 C222 258 252 300 245 398 Z" fill="none" stroke="var(--top-dark)" stroke-width="3"/>
      <path d="M118 258 C128 278 172 278 182 258 L172 292 C160 300 140 300 128 292 Z" fill="var(--sub)"/>
      <path d="M133 226 L133 262 C133 274 167 274 167 262 L167 226 Z" fill="var(--skin)"/>
      <path d="M133 250 C144 260 156 260 167 250 L167 262 C156 270 144 270 133 262 Z" fill="var(--skin-dark)" opacity=".5"/>

      <path d="M40 150 C18 210 30 265 58 292 C46 230 52 180 74 148 Z" fill="var(--hair-dark)"/>
      <path d="M260 150 C282 210 270 265 242 292 C254 230 248 180 226 148 Z" fill="var(--hair-dark)"/>

      <path d="M150 58 C202 58 226 106 222 158 C220 200 194 236 150 240 C106 236 80 200 78 158 C74 106 98 58 150 58 Z" fill="var(--skin)"/>

      <path d="M62 130 C56 78 96 34 150 34 C204 34 244 78 238 130 C224 96 202 104 190 90 C180 102 164 106 150 92 C136 106 120 102 110 90 C98 104 76 96 62 130 Z" fill="var(--hair)"/>
      <path d="M58 108 C24 122 18 172 36 208 C40 172 46 140 66 118 Z" fill="var(--hair)"/>
      <path d="M242 108 C276 122 282 172 264 208 C260 172 254 140 234 118 Z" fill="var(--hair)"/>

      <path d="M92 138 C102 128 122 128 132 136" stroke="#6b4a26" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M208 138 C198 128 178 128 168 136" stroke="#6b4a26" stroke-width="4" stroke-linecap="round" fill="none"/>

      <path d="M96 160 C102 150 124 150 130 160 C124 172 102 172 96 160 Z" fill="#3a2a2a"/>
      <path d="M204 160 C198 150 176 150 170 160 C176 172 198 172 204 160 Z" fill="#3a2a2a"/>
      <circle cx="110" cy="158" r="4.5" fill="#fff"/>
      <circle cx="190" cy="158" r="4.5" fill="#fff"/>
      <path d="M90 148 L124 140 M90 154 L123 148 M92 141 L122 132" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M210 148 L176 140 M210 154 L177 148 M208 141 L178 132" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"/>

      <path d="M148 172 C150 180 150 186 147 190" stroke="var(--skin-dark)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".7"/>

      <ellipse cx="88" cy="192" rx="15" ry="8" fill="var(--blush)" opacity="0.6"/>
      <ellipse cx="212" cy="192" rx="15" ry="8" fill="var(--blush)" opacity="0.6"/>

      <g id="${mouthId}">
        <ellipse cx="150" cy="208" rx="21" ry="15" fill="var(--lip-dark)"/>
        <ellipse cx="150" cy="204" rx="17" ry="10" fill="var(--lip)"/>
      </g>
    `;
  }
  document.getElementById("galPreview").innerHTML = galMarkup("mouthGroupPreview");
  document.getElementById("galSvg").innerHTML = galMarkup("mouthGroup");

  /* ------------------------------------------------------------
     効果音
     咀嚼音は assets/sfx/chew.mp3 を用意すればそれを再生する。
     まだファイルが無い場合はWebAudioで作った音で代用する。
  ------------------------------------------------------------ */
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function tone(freqStart, freqEnd, duration, startTime, gainPeak, type){
    if(!audioCtx) return;
    var t = audioCtx.currentTime + (startTime||0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freqStart, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(gainPeak||0.3, t + Math.min(0.02,duration/3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }
  function synthChew(){
    tone(520,260,0.11,0,0.32,"sine");
    tone(430,220,0.10,0.09,0.24,"sine");
  }
  function playPop(){ ensureAudio(); tone(900,1200,0.08,0,0.12,"sine"); }
  function playClear(){
    ensureAudio();
    var notes = [523,659,784,1046];
    notes.forEach(function(f,i){ tone(f,f,0.22,i*0.12,0.28,"triangle"); });
  }

  var CHEW_SRC = "assets/sfx/chew.mp3";
  var chewAudio = new Audio(CHEW_SRC);
  chewAudio.preload = "auto";
  var chewAudioReady = false;
  chewAudio.addEventListener("canplaythrough", function(){ chewAudioReady = true; }, {once:true});
  function playChew(){
    ensureAudio();
    if(chewAudioReady){
      try{
        var inst = chewAudio.cloneNode(true);
        var p = inst.play();
        if(p && p.catch) p.catch(synthChew);
        return;
      }catch(e){ /* WebAudioにフォールバック */ }
    }
    synthChew();
  }

  /* ------------------------------------------------------------
     画面切り替え
  ------------------------------------------------------------ */
  var titleScreen = document.getElementById("titleScreen");
  var gameScreen = document.getElementById("gameScreen");
  var stageClearScreen = document.getElementById("stageClearScreen");
  var finalClearScreen = document.getElementById("finalClearScreen");
  var ALL_SCREENS = [titleScreen, gameScreen, stageClearScreen, finalClearScreen];

  var startBtn = document.getElementById("startBtn");
  var nextStageBtn = document.getElementById("nextStageBtn");
  var restartBtn = document.getElementById("restartBtn");
  var stageClearTitle = document.getElementById("stageClearTitle");
  var hudStage = document.getElementById("hudStage");
  var hudFill = document.getElementById("hudFill");
  var hudCount = document.getElementById("hudCount");
  var foodLayer = document.getElementById("foodLayer");
  var tableWrap = document.getElementById("tableWrap");
  var mouthGroup = document.getElementById("galSvg").querySelector("#mouthGroup");

  var STAGES = [
    {stage:1, goal:10, plates:1},
    {stage:2, goal:20, plates:2},
    {stage:3, goal:30, plates:3},
    {stage:4, goal:40, plates:4},
    {stage:5, goal:50, plates:5}
  ];

  var FOODS_MAIN = ["🍙","🍗","🍳","🍤","🍣","🥟","🍖","🍥"];

  var currentStageIndex = 0;
  var stageToken = 0;
  var eatenInStage = 0;
  var spawnedInStage = 0;
  var plateEls = [];
  var pendingTimers = [];

  function showScreen(el){
    ALL_SCREENS.forEach(function(s){ s.hidden = (s !== el); });
  }

  function clearPendingTimers(){
    pendingTimers.forEach(clearTimeout);
    pendingTimers = [];
  }

  function buildTable(plateCount){
    tableWrap.innerHTML = "";
    plateEls = [];
    for(var i=0;i<plateCount;i++){
      var p = document.createElement("div");
      p.className = "plate";
      tableWrap.appendChild(p);
      plateEls.push(p);
    }
  }

  function updateHud(){
    var cfg = STAGES[currentStageIndex];
    hudStage.textContent = "ステージ " + cfg.stage;
    hudFill.style.width = (eatenInStage / cfg.goal * 100) + "%";
    hudCount.textContent = eatenInStage + " / " + cfg.goal;
  }

  function startStage(index){
    currentStageIndex = index;
    stageToken++;
    var myToken = stageToken;
    var cfg = STAGES[index];
    eatenInStage = 0;
    spawnedInStage = 0;
    clearPendingTimers();
    foodLayer.innerHTML = "";
    buildTable(cfg.plates);
    updateHud();
    showScreen(gameScreen);
    requestAnimationFrame(function(){
      if(myToken !== stageToken) return;
      plateEls.forEach(function(p){ trySpawnOnPlate(p, myToken); });
    });
  }

  function trySpawnOnPlate(plateEl, token){
    if(token !== stageToken) return;
    var cfg = STAGES[currentStageIndex];
    if(spawnedInStage >= cfg.goal) return;
    spawnedInStage++;
    var rect = plateEl.getBoundingClientRect();
    var size = 52;
    var el = document.createElement("div");
    el.className = "food";
    el.textContent = FOODS_MAIN[Math.floor(Math.random() * FOODS_MAIN.length)];
    el.style.left = (rect.left + rect.width/2 - size/2) + "px";
    el.style.top = (rect.top + rect.height/2 - size/2) + "px";
    el._plateEl = plateEl;
    el._token = token;
    foodLayer.appendChild(el);
    playPop();
    attachDrag(el);
  }

  function attachDrag(el){
    var dragging = false;
    var offsetX = 0, offsetY = 0;

    el.addEventListener("pointerdown", function(e){
      dragging = true;
      el.classList.add("dragging");
      el.setPointerCapture(e.pointerId);
      var rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      ensureAudio();
    });

    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var x = e.clientX - offsetX;
      var y = e.clientY - offsetY;
      el.style.left = x + "px";
      el.style.top = y + "px";
    });

    function endDrag(){
      if(!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      checkDrop(el);
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  }

  function checkDrop(el){
    if(el._token !== stageToken) return;
    var foodRect = el.getBoundingClientRect();
    var foodCx = foodRect.left + foodRect.width/2;
    var foodCy = foodRect.top + foodRect.height/2;
    var mouthRect = mouthGroup.getBoundingClientRect();
    var mouthCx = mouthRect.left + mouthRect.width/2;
    var mouthCy = mouthRect.top + mouthRect.height/2;
    var dist = Math.hypot(foodCx - mouthCx, foodCy - mouthCy);
    var threshold = Math.max(mouthRect.width, mouthRect.height)/2 + 50;
    if(dist <= threshold){
      eatFood(el, mouthCx, mouthCy);
    }
  }

  function eatFood(el, atX, atY){
    var token = el._token;
    var plateEl = el._plateEl;
    el.classList.add("eaten");
    playChew();
    mouthGroup.classList.remove("chomp");
    void mouthGroup.offsetWidth;
    mouthGroup.classList.add("chomp");
    burstParticles(atX, atY);
    eatenInStage++;
    updateHud();
    pendingTimers.push(setTimeout(function(){
      if(el.parentNode) el.parentNode.removeChild(el);
    }, 260));

    var cfg = STAGES[currentStageIndex];
    if(eatenInStage >= cfg.goal){
      pendingTimers.push(setTimeout(function(){
        if(token !== stageToken) return;
        onStageComplete();
      }, 420));
    } else {
      pendingTimers.push(setTimeout(function(){
        trySpawnOnPlate(plateEl, token);
      }, 320));
    }
  }

  function onStageComplete(){
    var cfg = STAGES[currentStageIndex];
    playClear();
    launchConfetti();
    if(currentStageIndex >= STAGES.length - 1){
      showScreen(finalClearScreen);
    } else {
      stageClearTitle.textContent = "ステージ" + cfg.stage + " クリア!!";
      showScreen(stageClearScreen);
    }
  }

  function burstParticles(x, y){
    var glyphs = ["✨","💖","⭐"];
    for(var i=0;i<8;i++){
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      var angle = (Math.PI*2) * (i/8) + Math.random()*0.4;
      var dist = 40 + Math.random()*30;
      p.style.setProperty("--dx", "translate(" + Math.cos(angle)*dist + "px," + Math.sin(angle)*dist + "px)");
      p.style.left = (x - 10) + "px";
      p.style.top = (y - 10) + "px";
      document.body.appendChild(p);
      (function(node){
        setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 650);
      })(p);
    }
  }

  function launchConfetti(){
    var glyphs = ["🎉","✨","💕","⭐","🌸"];
    for(var i=0;i<26;i++){
      (function(){
        var c = document.createElement("div");
        c.className = "confetti";
        c.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
        c.style.left = (Math.random()*100) + "vw";
        c.style.animationDuration = (2.2 + Math.random()*1.6) + "s";
        c.style.animationDelay = (Math.random()*0.6) + "s";
        document.body.appendChild(c);
        setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 4500);
      })();
    }
  }

  /* ------------------------------------------------------------
     背景のふわふわ飾り(キラキラ+くだもの)
  ------------------------------------------------------------ */
  (function ambientBackground(){
    var glyphs = ["✨","💗","⭐","💫","🍇","🍓","🍑","🍋","🍒","🍉","🍌","🍊"];
    for(var i=0;i<16;i++){
      var s = document.createElement("div");
      s.className = "bgdeco";
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = (Math.random()*94) + "vw";
      s.style.top = (Math.random()*90) + "vh";
      s.style.animationDuration = (7 + Math.random()*5) + "s";
      s.style.animationDelay = (Math.random()*4) + "s";
      document.body.appendChild(s);
    }
  })();

  startBtn.addEventListener("click", function(){ ensureAudio(); startStage(0); });
  nextStageBtn.addEventListener("click", function(){ startStage(currentStageIndex + 1); });
  restartBtn.addEventListener("click", function(){ startStage(0); });

})();
</script>
