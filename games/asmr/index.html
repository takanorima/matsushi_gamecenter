<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ASMRゲーム(寛成さん作)</title>
<style>
  :root{
    --main:#ffd6ff;
    --sub:#dcffff;
    --paper:#fdf6ea;
    --ink:#2b2320;
    --wood:#c68a52;
    --wood-dark:#96602f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--sub),var(--main) 70%);
    background-size:200% 200%;
    animation:bgshift 14s ease-in-out infinite;
    user-select:none;
    touch-action:none;
  }
  @keyframes bgshift{
    0%,100%{background-position:0% 0%;}
    50%{background-position:100% 100%;}
  }
  #app{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1.5rem;
    z-index:1;
  }
  .screen[hidden]{display:none;}

  /* ---- ふわふわ背景の飾り(キラキラ+くだもの) ---- */
  .bgdeco{
    position:fixed;
    pointer-events:none;
    font-size:1.5rem;
    opacity:.5;
    animation:float 9s ease-in-out infinite;
    z-index:0;
  }
  @keyframes float{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-26px) rotate(15deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }

  /* ---- タイトル/クリア共通の見出し ---- */
  h1,h2{
    color:#c9548a;
    text-shadow:0 2px 0 #fff, 0 4px 10px rgba(200,90,140,.25);
    margin:0 0 .3rem;
  }
  h1{font-size:2rem;}
  h2{font-size:2.1rem;}
  .screen p{
    margin:0 0 1.4rem;
    font-size:1rem;
    color:#7c5a6b;
  }
  .gal-figure{
    position:relative;
    width:100%;
  }
  .gal-img{
    display:block;
    width:100%;
    height:auto;
    border-radius:22px;
    background:var(--paper);
  }
  .gal-preview{
    width:min(64vw,280px);
    filter:drop-shadow(0 8px 14px rgba(180,110,60,.25));
    margin-bottom:1.2rem;
  }
  .stage-hint{
    font-size:.85rem;
    color:#a5789a;
    margin:-.8rem 0 1.2rem;
  }
  button.big{
    font-size:1.25rem;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#ff9ecb,#ff7ab0);
    border:none;
    border-radius:999px;
    padding:.9rem 2.2rem;
    box-shadow:0 6px 0 #e0568f, 0 10px 18px rgba(224,86,143,.35);
    cursor:pointer;
    transition:transform .08s ease;
  }
  button.big:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #e0568f, 0 4px 10px rgba(224,86,143,.35);
  }

  /* ---- ゲーム画面 ---- */
  #gameScreen{padding:0;justify-content:flex-start;}
  #hud{
    position:fixed;
    top:0;left:0;right:0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:.4rem .6rem;
    padding:.7rem 1rem;
    z-index:5;
  }
  #hudStage,#hudCount{
    font-weight:bold;
    color:#c9548a;
    background:#fff;
    border-radius:999px;
    padding:.15rem .7rem;
    font-size:.9rem;
    box-shadow:0 2px 6px rgba(120,80,100,.15);
    white-space:nowrap;
  }
  #hudBar{
    width:min(56vw,260px);
    height:1.1rem;
    background:rgba(255,255,255,.6);
    border-radius:999px;
    overflow:hidden;
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(120,80,100,.15);
  }
  #hudFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff9ecb,#ffd166);
    transition:width .35s cubic-bezier(.3,1.6,.5,1);
    border-radius:999px;
  }

  #galWrap{
    position:fixed;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    width:min(86vw,440px);
    pointer-events:none;
    z-index:2;
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translate(-50%,-50%);}
    50%{transform:translate(-50%,calc(-50% - 6px));}
  }
  #galFigure .gal-open{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .04s linear;
  }
  #galFigure .gal-closed{
    transition:opacity .04s linear;
  }
  #galFigure.chewing .gal-open{opacity:1;}
  #galFigure.chewing .gal-closed{opacity:0;}
  #galFigure.chewing{animation:chomp .28s ease;}
  @keyframes chomp{
    0%{transform:scale(1);}
    40%{transform:scale(1.05);}
    100%{transform:scale(1);}
  }
  .mouth-target{
    position:absolute;
    left:51.5%;
    top:65%;
    width:14%;
    height:14%;
    transform:translate(-50%,-50%);
  }

  /* ---- テーブルとお皿 ---- */
  #tableWrap{
    position:fixed;
    left:0;right:0;bottom:0;
    height:clamp(96px,15vh,140px);
    background:linear-gradient(180deg,var(--wood),var(--wood-dark) 75%);
    border-top:6px solid #7f4f24;
    box-shadow:0 -8px 18px rgba(70,40,10,.25), inset 0 6px 10px rgba(255,255,255,.12);
    z-index:4;
    display:flex;
    align-items:flex-start;
    justify-content:space-evenly;
    padding:10px 8px 0;
  }
  .plate{
    width:clamp(42px,16vw,66px);
    height:clamp(42px,16vw,66px);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffffff,#f1eee8 60%,#d9d3c6 100%);
    border:3px solid #fff;
    box-shadow:0 5px 8px rgba(60,30,5,.3), inset 0 0 0 6px rgba(0,0,0,.05);
    margin-top:-16px;
    flex-shrink:0;
  }

  #foodLayer{
    position:fixed;
    inset:0;
    z-index:6;
  }
  .food{
    position:fixed;
    font-size:clamp(2rem,8vw,2.9rem);
    line-height:1;
    filter:drop-shadow(0 6px 8px rgba(120,80,60,.25));
    cursor:grab;
    touch-action:none;
    animation:pop-in .28s cubic-bezier(.3,1.7,.4,1), wiggle 2.4s ease-in-out infinite .28s;
    will-change:transform;
  }
  .food.dragging{
    cursor:grabbing;
    animation:none !important;
    scale:1.15;
    filter:drop-shadow(0 10px 14px rgba(120,80,60,.35));
    z-index:7;
  }
  .food.eaten{
    animation:eaten-pop .28s ease forwards !important;
    pointer-events:none;
  }
  @keyframes pop-in{
    0%{transform:scale(0) rotate(-20deg);opacity:0;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }
  @keyframes eaten-pop{
    0%{transform:scale(1);opacity:1;}
    100%{transform:scale(0.1);opacity:0;}
  }

  .particle{
    position:fixed;
    font-size:1.3rem;
    pointer-events:none;
    z-index:8;
    animation:burst .6s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:var(--dx) scale(.4);opacity:0;}
  }

  .confetti{
    position:fixed;
    font-size:1.6rem;
    top:-2rem;
    pointer-events:none;
    z-index:9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(112vh) rotate(360deg);opacity:.2;}
  }

  #credit{
    position:fixed;
    top:.6rem;
    right:.6rem;
    z-index:20;
    pointer-events:none;
    background:rgba(255,255,255,.75);
    color:#c9548a;
    font-size:.75rem;
    font-weight:bold;
    padding:.3rem .65rem;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(120,80,100,.18);
    white-space:nowrap;
  }
</style>
</head>
<body>
<div id="credit">Kansei 作</div>
<div id="app">

  <!-- タイトル画面 -->
  <section id="titleScreen" class="screen">
    <h1>ASMRゲーム</h1>
    <p>テーブルのおさらから ゆびで きゅうりを つまんで<br>おくちに はこんであげよう♪</p>
    <div class="gal-figure gal-preview">
      <img class="gal-img" src="assets/art/gal_closed.jpg" alt="ギャルキャラクター">
    </div>
    <div class="stage-hint">ぜんぶで 5ステージ あるよ</div>
    <button id="startBtn" class="big" type="button">▶ はじめる</button>
  </section>

  <!-- ゲーム画面 -->
  <section id="gameScreen" class="screen" hidden>
    <div id="hud">
      <div id="hudStage">ステージ 1</div>
      <div id="hudBar"><div id="hudFill"></div></div>
      <div id="hudCount">0 / 10</div>
    </div>
    <div id="galWrap">
      <div id="galFigure" class="gal-figure">
        <img class="gal-img gal-closed" src="assets/art/gal_closed.jpg" alt="ギャルキャラクター(口をとじた状態)">
        <img class="gal-img gal-open" src="assets/art/gal_open.jpg" alt="ギャルキャラクター(口をあけた状態)">
        <div id="mouthTarget" class="mouth-target"></div>
      </div>
    </div>
    <div id="foodLayer"></div>
    <div id="tableWrap"></div>
  </section>

  <!-- ステージクリア画面 -->
  <section id="stageClearScreen" class="screen" hidden>
    <h2 id="stageClearTitle">ステージ1 クリア!!</h2>
    <p>つぎのステージに ちょうせんしよう!</p>
    <button id="nextStageBtn" class="big" type="button">▶ つぎへ</button>
  </section>

  <!-- 全ステージクリア画面 -->
  <section id="finalClearScreen" class="screen" hidden>
    <h2>全ステージ クリア!! 🎉</h2>
    <p>5つの ステージを ぜんぶ クリアしたよ、すごい!</p>
    <button id="restartBtn" class="big" type="button">🔁 さいしょから あそぶ</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------
     効果音
     咀嚼音は assets/sfx/chew.wav を用意すればそれを再生する。
     まだファイルが無い場合はWebAudioで作った音で代用する。
  ------------------------------------------------------------ */
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function tone(freqStart, freqEnd, duration, startTime, gainPeak, type){
    if(!audioCtx) return;
    var t = audioCtx.currentTime + (startTime||0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freqStart, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(gainPeak||0.3, t + Math.min(0.02,duration/3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }
  function synthChew(){
    tone(520,260,0.11,0,0.32,"sine");
    tone(430,220,0.10,0.09,0.24,"sine");
  }
  function playPop(){ ensureAudio(); tone(900,1200,0.08,0,0.12,"sine"); }
  function playClear(){
    ensureAudio();
    var notes = [523,659,784,1046];
    notes.forEach(function(f,i){ tone(f,f,0.22,i*0.12,0.28,"triangle"); });
  }

  var CHEW_SRC = "assets/sfx/chew.wav";
  var chewAudio = new Audio(CHEW_SRC);
  chewAudio.preload = "auto";
  var chewAudioReady = false;
  chewAudio.addEventListener("canplaythrough", function(){ chewAudioReady = true; }, {once:true});
  function playChew(){
    ensureAudio();
    if(chewAudioReady){
      try{
        var inst = chewAudio.cloneNode(true);
        var p = inst.play();
        if(p && p.catch) p.catch(synthChew);
        return;
      }catch(e){ /* WebAudioにフォールバック */ }
    }
    synthChew();
  }

  /* ------------------------------------------------------------
     画面切り替え
  ------------------------------------------------------------ */
  var titleScreen = document.getElementById("titleScreen");
  var gameScreen = document.getElementById("gameScreen");
  var stageClearScreen = document.getElementById("stageClearScreen");
  var finalClearScreen = document.getElementById("finalClearScreen");
  var ALL_SCREENS = [titleScreen, gameScreen, stageClearScreen, finalClearScreen];

  var startBtn = document.getElementById("startBtn");
  var nextStageBtn = document.getElementById("nextStageBtn");
  var restartBtn = document.getElementById("restartBtn");
  var stageClearTitle = document.getElementById("stageClearTitle");
  var hudStage = document.getElementById("hudStage");
  var hudFill = document.getElementById("hudFill");
  var hudCount = document.getElementById("hudCount");
  var foodLayer = document.getElementById("foodLayer");
  var tableWrap = document.getElementById("tableWrap");
  var galFigure = document.getElementById("galFigure");
  var mouthTarget = document.getElementById("mouthTarget");

  var STAGES = [
    {stage:1, goal:10, plates:1},
    {stage:2, goal:20, plates:2},
    {stage:3, goal:30, plates:3},
    {stage:4, goal:40, plates:4},
    {stage:5, goal:50, plates:5}
  ];

  /* 咀嚼音サンプル(きゅうり)にあわせて、いまは仮できゅうりのみにしている */
  var FOODS_MAIN = ["🥒"];

  var currentStageIndex = 0;
  var stageToken = 0;
  var eatenInStage = 0;
  var spawnedInStage = 0;
  var plateEls = [];
  var pendingTimers = [];

  function showScreen(el){
    ALL_SCREENS.forEach(function(s){ s.hidden = (s !== el); });
  }

  function clearPendingTimers(){
    pendingTimers.forEach(clearTimeout);
    pendingTimers = [];
  }

  function buildTable(plateCount){
    tableWrap.innerHTML = "";
    plateEls = [];
    for(var i=0;i<plateCount;i++){
      var p = document.createElement("div");
      p.className = "plate";
      tableWrap.appendChild(p);
      plateEls.push(p);
    }
  }

  function updateHud(){
    var cfg = STAGES[currentStageIndex];
    hudStage.textContent = "ステージ " + cfg.stage;
    hudFill.style.width = (eatenInStage / cfg.goal * 100) + "%";
    hudCount.textContent = eatenInStage + " / " + cfg.goal;
  }

  function startStage(index){
    currentStageIndex = index;
    stageToken++;
    var myToken = stageToken;
    var cfg = STAGES[index];
    eatenInStage = 0;
    spawnedInStage = 0;
    clearPendingTimers();
    foodLayer.innerHTML = "";
    buildTable(cfg.plates);
    updateHud();
    showScreen(gameScreen);
    requestAnimationFrame(function(){
      if(myToken !== stageToken) return;
      plateEls.forEach(function(p){ trySpawnOnPlate(p, myToken); });
    });
  }

  function trySpawnOnPlate(plateEl, token){
    if(token !== stageToken) return;
    var cfg = STAGES[currentStageIndex];
    if(spawnedInStage >= cfg.goal) return;
    spawnedInStage++;
    var rect = plateEl.getBoundingClientRect();
    var size = 52;
    var el = document.createElement("div");
    el.className = "food";
    el.textContent = FOODS_MAIN[Math.floor(Math.random() * FOODS_MAIN.length)];
    el.style.left = (rect.left + rect.width/2 - size/2) + "px";
    el.style.top = (rect.top + rect.height/2 - size/2) + "px";
    el._plateEl = plateEl;
    el._token = token;
    foodLayer.appendChild(el);
    playPop();
    attachDrag(el);
  }

  function attachDrag(el){
    var dragging = false;
    var offsetX = 0, offsetY = 0;

    el.addEventListener("pointerdown", function(e){
      dragging = true;
      el.classList.add("dragging");
      el.setPointerCapture(e.pointerId);
      var rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      ensureAudio();
    });

    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var x = e.clientX - offsetX;
      var y = e.clientY - offsetY;
      el.style.left = x + "px";
      el.style.top = y + "px";
    });

    function endDrag(){
      if(!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      checkDrop(el);
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  }

  function checkDrop(el){
    if(el._token !== stageToken) return;
    var foodRect = el.getBoundingClientRect();
    var foodCx = foodRect.left + foodRect.width/2;
    var foodCy = foodRect.top + foodRect.height/2;
    var mouthRect = mouthTarget.getBoundingClientRect();
    var mouthCx = mouthRect.left + mouthRect.width/2;
    var mouthCy = mouthRect.top + mouthRect.height/2;
    var dist = Math.hypot(foodCx - mouthCx, foodCy - mouthCy);
    var threshold = Math.max(mouthRect.width, mouthRect.height)/2 + 60;
    if(dist <= threshold){
      eatFood(el, mouthCx, mouthCy);
    }
  }

  function eatFood(el, atX, atY){
    var token = el._token;
    var plateEl = el._plateEl;
    el.classList.add("eaten");
    playChew();
    galFigure.classList.add("chewing");
    pendingTimers.push(setTimeout(function(){
      galFigure.classList.remove("chewing");
    }, 280));
    burstParticles(atX, atY);
    eatenInStage++;
    updateHud();
    pendingTimers.push(setTimeout(function(){
      if(el.parentNode) el.parentNode.removeChild(el);
    }, 260));

    var cfg = STAGES[currentStageIndex];
    if(eatenInStage >= cfg.goal){
      pendingTimers.push(setTimeout(function(){
        if(token !== stageToken) return;
        onStageComplete();
      }, 420));
    } else {
      pendingTimers.push(setTimeout(function(){
        trySpawnOnPlate(plateEl, token);
      }, 320));
    }
  }

  function onStageComplete(){
    var cfg = STAGES[currentStageIndex];
    playClear();
    launchConfetti();
    if(currentStageIndex >= STAGES.length - 1){
      showScreen(finalClearScreen);
    } else {
      stageClearTitle.textContent = "ステージ" + cfg.stage + " クリア!!";
      showScreen(stageClearScreen);
    }
  }

  function burstParticles(x, y){
    var glyphs = ["✨","💖","⭐"];
    for(var i=0;i<8;i++){
      var p = document.createElement("div");
      p.className = "particle";
      p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      var angle = (Math.PI*2) * (i/8) + Math.random()*0.4;
      var dist = 40 + Math.random()*30;
      p.style.setProperty("--dx", "translate(" + Math.cos(angle)*dist + "px," + Math.sin(angle)*dist + "px)");
      p.style.left = (x - 10) + "px";
      p.style.top = (y - 10) + "px";
      document.body.appendChild(p);
      (function(node){
        setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 650);
      })(p);
    }
  }

  function launchConfetti(){
    var glyphs = ["🎉","✨","💕","⭐","🌸"];
    for(var i=0;i<26;i++){
      (function(){
        var c = document.createElement("div");
        c.className = "confetti";
        c.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
        c.style.left = (Math.random()*100) + "vw";
        c.style.animationDuration = (2.2 + Math.random()*1.6) + "s";
        c.style.animationDelay = (Math.random()*0.6) + "s";
        document.body.appendChild(c);
        setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 4500);
      })();
    }
  }

  /* ------------------------------------------------------------
     背景のふわふわ飾り(キラキラ+くだもの)
  ------------------------------------------------------------ */
  (function ambientBackground(){
    var glyphs = ["✨","💗","⭐","💫","🍇","🍓","🍑","🍋","🍒","🍉","🍌","🍊"];
    for(var i=0;i<16;i++){
      var s = document.createElement("div");
      s.className = "bgdeco";
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = (Math.random()*94) + "vw";
      s.style.top = (Math.random()*90) + "vh";
      s.style.animationDuration = (7 + Math.random()*5) + "s";
      s.style.animationDelay = (Math.random()*4) + "s";
      document.body.appendChild(s);
    }
  })();

  startBtn.addEventListener("click", function(){ ensureAudio(); startStage(0); });
  nextStageBtn.addEventListener("click", function(){ startStage(currentStageIndex + 1); });
  restartBtn.addEventListener("click", function(){ startStage(0); });

})();
</script>
</body>
</html>
