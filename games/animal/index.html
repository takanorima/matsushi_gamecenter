<title>動物育成ゲーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%81%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --main: #a7c6ff;
    --main-ink: #1c2b52;
    --sub: #cbf0ff;
    --paper: #eef4ff;
    --paper-line: rgba(70, 96, 160, 0.08);
    --surface: #ffffff;
    --ink: #24304d;
    --ink-soft: #5c6a8c;
    --ink-faint: #8a95b8;
    --border: #d5e3ff;
    --border-strong: #b7cdfa;
    --accent: #ff9f6b;
    --font-body: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --main: #4d6bb0;
      --main-ink: #eef4ff;
      --sub: #2e4a63;
      --paper: #171b2b;
      --paper-line: rgba(255, 255, 255, 0.06);
      --surface: #20263c;
      --ink: #eef1fb;
      --ink-soft: #a8b1d6;
      --ink-faint: #6f78a0;
      --border: #333c5c;
      --border-strong: #4a557f;
      --accent: #ffb385;
    }
  }
  :root[data-theme="dark"] {
    --main: #4d6bb0;
    --main-ink: #eef4ff;
    --sub: #2e4a63;
    --paper: #171b2b;
    --paper-line: rgba(255, 255, 255, 0.06);
    --surface: #20263c;
    --ink: #eef1fb;
    --ink-soft: #a8b1d6;
    --ink-faint: #6f78a0;
    --border: #333c5c;
    --border-strong: #4a557f;
    --accent: #ffb385;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 30rem;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 3rem;
  }

  header.top {
    text-align: center;
    margin-bottom: 1rem;
  }
  .eyebrow {
    margin: 0 0 .2rem;
    font-size: .8rem;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  h1 {
    margin: 0;
    font-size: 1.6rem;
  }
  .credit {
    margin: .3rem 0 0;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .goal {
    margin: .35rem 0 0;
    font-size: .85rem;
    color: var(--ink-faint);
  }

  .stat-row {
    display: flex;
    gap: .5rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0 0 1rem;
  }
  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .35rem .8rem;
    font-size: .85rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .stat-pill strong {
    color: var(--ink);
    font-size: 1rem;
  }
  .zukan-btn {
    background: var(--sub);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: .35rem .9rem;
    font: inherit;
    font-weight: 700;
    font-size: .85rem;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }

  .card {
    position: relative;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 1.5rem 1.25rem 1.75rem;
    text-align: center;
    box-shadow: 0 12px 30px rgba(40, 60, 120, 0.1);
  }

  .new-badge {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) rotate(-6deg);
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: .8rem;
    padding: .25rem .7rem;
    border-radius: 8px;
    letter-spacing: .05em;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
    animation: newPop .5s ease;
  }
  @keyframes newPop {
    0%   { transform: translateX(-50%) rotate(-6deg) scale(0); }
    60%  { transform: translateX(-50%) rotate(-6deg) scale(1.2); }
    100% { transform: translateX(-50%) rotate(-6deg) scale(1); }
  }

  .stage-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .animal-stage {
    margin: .5rem auto 1.1rem;
    width: 11rem;
    height: 11rem;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, var(--sub), var(--main) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .animal {
    font-size: 6rem;
    line-height: 1;
    display: inline-block;
    transform-origin: 50% 80%;
  }
  .animal.bounce {
    animation: chomp .5s ease;
  }
  @keyframes chomp {
    0%   { transform: scale(1) rotate(0); }
    30%  { transform: scale(1.18) rotate(-4deg); }
    60%  { transform: scale(0.94) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .flying-food {
    position: absolute;
    left: 50%;
    bottom: 92px;
    font-size: 1.7rem;
    transform: translateX(-50%);
    animation: flyUp .6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes flyUp {
    0%   { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-190px) scale(.4); opacity: 0; }
  }

  .progress-label {
    margin: 0 0 .45rem;
    font-size: .95rem;
    color: var(--ink-soft);
  }
  .progress-label strong {
    color: var(--ink);
    font-size: 1.1rem;
  }
  .progress-bar {
    height: .8rem;
    border-radius: 999px;
    background: var(--sub);
    border: 1px solid var(--border-strong);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--main), var(--accent));
    border-radius: inherit;
    transition: width .35s ease;
  }

  .total-feeds {
    margin: .9rem 0 0;
    font-size: .85rem;
    color: var(--ink-faint);
  }

  .food-row-label {
    margin: 1.1rem 0 .4rem;
    font-size: .8rem;
    color: var(--ink-faint);
  }
  .food-row {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    justify-content: center;
  }
  .food-btn {
    font-size: 1.7rem;
    background: linear-gradient(180deg, var(--sub), var(--main));
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: .5rem .65rem;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--border-strong);
    touch-action: manipulation;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .food-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--border-strong);
  }
  .food-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .food-btn.selected {
    background: linear-gradient(180deg, #fff2c2, var(--accent));
    border-color: var(--accent);
    box-shadow: 0 4px 0 #c96a35;
    transform: translateY(-2px);
  }

  .a-btn-row {
    display: flex;
    justify-content: center;
    margin-top: 1.4rem;
  }
  .a-btn-wrap {
    text-align: center;
  }
  .a-btn {
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #ff9466, #d94f1e 70%);
    color: #fff;
    font-family: var(--font-body);
    font-size: 1.9rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 6px 0 #a13c14, 0 10px 18px rgba(0, 0, 0, .25);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .a-btn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #a13c14, 0 4px 10px rgba(0, 0, 0, .2);
  }
  .a-btn:disabled {
    opacity: .5;
    cursor: default;
  }
  .a-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
  .a-btn-caption {
    margin: .5rem 0 0;
    font-size: .8rem;
    color: var(--ink-faint);
  }

  .level-up-toast {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.6);
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: .55rem 1rem;
    font-weight: 700;
    font-size: .95rem;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    animation: popToast 1.15s ease forwards;
    white-space: nowrap;
    z-index: 2;
  }
  @keyframes popToast {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    35%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
  }

  footer.note {
    margin-top: 1rem;
    text-align: center;
    font-size: .8rem;
    color: var(--ink-faint);
  }

  .clear-overlay, .zukan-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 48, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    z-index: 30;
  }
  .clear-overlay[hidden], .zukan-overlay[hidden] { display: none; }
  .clear-card {
    background: var(--surface);
    border-radius: 22px;
    padding: 2rem 1.5rem;
    max-width: 22rem;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
  }
  .clear-emoji {
    font-size: 3.2rem;
    margin: 0 0 .4rem;
  }
  .clear-card h2 {
    margin: 0 0 .5rem;
    font-size: 1.6rem;
  }
  .clear-card p {
    margin: 0 0 .5rem;
    color: var(--ink-soft);
  }
  .clear-card .clear-stats {
    margin: 0 0 1.2rem;
    font-size: .85rem;
    color: var(--ink-faint);
  }
  .feed-btn {
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--main-ink);
    background: linear-gradient(180deg, var(--sub), var(--main));
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    padding: .85rem 1rem;
    cursor: pointer;
    touch-action: manipulation;
    width: 100%;
  }

  .zukan-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 1.1rem;
    max-width: 34rem;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .zukan-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .75rem;
    gap: .5rem;
  }
  .zukan-head h2 {
    margin: 0;
    font-size: 1.15rem;
  }
  .zukan-head span {
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .zukan-close {
    border: none;
    background: var(--sub);
    border-radius: 50%;
    width: 2rem;
    height: 2rem;
    font-size: 1rem;
    cursor: pointer;
    flex: none;
  }
  .zukan-grid {
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(3.2rem, 1fr));
    gap: .4rem;
    padding: .2rem;
  }
  .zukan-cell {
    aspect-ratio: 1;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }
  .zukan-cell.locked {
    color: var(--ink-faint);
    font-size: 1.2rem;
  }
  .zukan-cell.collected {
    background: linear-gradient(180deg, var(--sub), var(--main));
  }

  .confetti {
    position: fixed;
    top: -2rem;
    font-size: 1.5rem;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 31;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(340deg); opacity: .9; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <p class="eyebrow">🎮 まつしげーむせんたー</p>
    <h1>動物育成ゲーム</h1>
    <p class="credit">花乃子さんの企画をもとに制作</p>
    <p class="goal">えさをあげて、120しゅるいの どうぶつを ぜんぶ あつめよう!</p>
  </header>

  <div class="stat-row">
    <span class="stat-pill">Lv. <strong id="levelValue">1</strong></span>
    <span class="stat-pill">📖 <strong id="collectedCount">0</strong> / 120</span>
    <button type="button" class="zukan-btn" id="zukanBtn">図鑑をみる</button>
  </div>

  <main class="card" id="game">
    <div class="new-badge" id="newBadge" hidden>NEW!</div>
    <p class="stage-name" id="stageName"></p>
    <div class="animal-stage">
      <span class="animal" id="animalEmoji"></span>
    </div>

    <div id="progressWrap">
      <p class="progress-label" id="progressLabel"></p>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <p class="total-feeds">これまでにあげた かいすう: <strong id="totalFeeds">0</strong> かい</p>

    <p class="food-row-label">つかう えさを えらぼう</p>
    <div class="food-row" id="foodRow"></div>

    <div class="a-btn-row">
      <div class="a-btn-wrap">
        <button type="button" class="a-btn" id="feedActionBtn" aria-label="えさをあげる(Xボタン)">X</button>
        <p class="a-btn-caption">おすと えさをあげる</p>
      </div>
    </div>
  </main>

  <footer class="note">あそびかた: えさをえらんで、Xボタンをおす(キーボードの X キーでもOK)</footer>
</div>

<div class="clear-overlay" id="clearOverlay" hidden>
  <div class="clear-card">
    <p class="clear-emoji">🏆🎉</p>
    <h2>コレクション コンプリート!</h2>
    <p>120しゅるい ぜんぶの どうぶつを あつめたね!</p>
    <p class="clear-stats" id="clearStats"></p>
    <button type="button" class="feed-btn" id="restartBtn">もういちど あそぶ</button>
  </div>
</div>

<div class="zukan-overlay" id="zukanOverlay" hidden>
  <div class="zukan-card">
    <div class="zukan-head">
      <h2>どうぶつずかん</h2>
      <span id="zukanCount"></span>
      <button type="button" class="zukan-close" id="zukanClose" aria-label="とじる">✕</button>
    </div>
    <div class="zukan-grid" id="zukanGrid"></div>
  </div>
</div>

    { e: "🐜", n: "あり" },
    { e: "🐝", n: "はち" },
    { e: "🪲", n: "かぶとむし" },
    { e: "🐞", n: "てんとうむし" },
    { e: "🦗", n: "こおろぎ" },
    { e: "🕷️", n: "くも" },
    { e: "🦂", n: "さそり" },
    { e: "🦟", n: "か" },
    { e: "🪰", n: "はえ" },
    { e: "🪱", n: "みみず" },
    { e: "🪳", n: "ごきぶり" },
    { e: "🦠", n: "びせいぶつ" },
    { e: "🦮", n: "もうどうけん" },
    { e: "🐕‍🦺", n: "さぎょういぬ" }
  ];

  var FOODS = [
    { e: "🍖", n: "おにく", lv: 1 },
    { e: "🐟", n: "さかな", lv: 4 },
    { e: "🥕", n: "にんじん", lv: 8 },
    { e: "🍯", n: "はちみつ", lv: 13 },
    { e: "🌰", n: "どんぐり", lv: 19 },
    { e: "🍓", n: "いちご", lv: 26 },
    { e: "🧀", n: "チーズ", lv: 34 },
    { e: "🍞", n: "パン", lv: 43 },
    { e: "🍪", n: "クッキー", lv: 53 },
    { e: "🍎", n: "りんご", lv: 64 }
  ];

  var BASE_FEEDS_PER_ANIMAL = 3;
  var MAX_FEEDS_PER_ANIMAL = 9;
  var FEEDS_STEP_EVERY_LEVELS = 15;
  var NEW_ANIMAL_BIAS = 0.7;

  function feedsNeededForLevel(lv) {
    var extra = Math.floor((lv - 1) / FEEDS_STEP_EVERY_LEVELS);
    return Math.min(BASE_FEEDS_PER_ANIMAL + extra, MAX_FEEDS_PER_ANIMAL);
  }

  var game = document.getElementById("game");
  var levelValueEl = document.getElementById("levelValue");
  var collectedCountEl = document.getElementById("collectedCount");
  var zukanBtn = document.getElementById("zukanBtn");
  var newBadge = document.getElementById("newBadge");
  var stageNameEl = document.getElementById("stageName");
  var animalEl = document.getElementById("animalEmoji");
  var progressWrap = document.getElementById("progressWrap");
  var progressLabel = document.getElementById("progressLabel");
  var progressFill = document.getElementById("progressFill");
  var totalFeedsEl = document.getElementById("totalFeeds");
  var foodRow = document.getElementById("foodRow");
  var feedActionBtn = document.getElementById("feedActionBtn");
  var clearOverlay = document.getElementById("clearOverlay");
  var clearStatsEl = document.getElementById("clearStats");
  var restartBtn = document.getElementById("restartBtn");
  var zukanOverlay = document.getElementById("zukanOverlay");
  var zukanGrid = document.getElementById("zukanGrid");
  var zukanCount = document.getElementById("zukanCount");
  var zukanClose = document.getElementById("zukanClose");

  var level = 1;
  var totalFeeds = 0;
  var feedsInEncounter = 0;
  var collected = {};
  var collectedCount = 0;
  var currentIndex = -1;
  var currentIsNew = false;
  var cleared = false;
  var selectedFoodIndex = 0;

  function isCleared() {
    return collectedCount >= ANIMALS.length;
  }

  function pickAnimalIndex() {
    var uncollected = [];
    for (var i = 0; i < ANIMALS.length; i++) {
      if (!collected[i]) uncollected.push(i);
    }
    if (uncollected.length > 0 && Math.random() < NEW_ANIMAL_BIAS) {
      return uncollected[Math.floor(Math.random() * uncollected.length)];
    }
    return Math.floor(Math.random() * ANIMALS.length);
  }

  function unlockedFoods() {
    var list = [];
    for (var i = 0; i < FOODS.length; i++) {
      if (FOODS[i].lv <= level) list.push(FOODS[i]);
    }
    return list;
  }

  function startEncounter() {
    currentIndex = pickAnimalIndex();
    currentIsNew = !collected[currentIndex];
    feedsInEncounter = 0;
  }

  function render() {
    levelValueEl.textContent = String(level);
    collectedCountEl.textContent = String(collectedCount);

    var animal = ANIMALS[currentIndex];
    stageNameEl.textContent = animal.n;
    animalEl.textContent = animal.e;
    newBadge.hidden = !currentIsNew;
    totalFeedsEl.textContent = String(totalFeeds);

    if (isCleared()) {
      progressWrap.style.visibility = "hidden";
    } else {
      progressWrap.style.visibility = "visible";
      var need = feedsNeededForLevel(level);
      var remain = need - feedsInEncounter;
      progressLabel.innerHTML = "このこに あと <strong>" + remain + "</strong> かい";
      progressFill.style.width = Math.round((feedsInEncounter / need) * 100) + "%";
    }

    renderFoodRow();
    feedActionBtn.disabled = cleared;
  }

  function getSelectedFoodEmoji() {
    var foods = unlockedFoods();
    if (selectedFoodIndex >= foods.length) selectedFoodIndex = foods.length - 1;
    if (selectedFoodIndex < 0) selectedFoodIndex = 0;
    return foods[selectedFoodIndex].e;
  }

  function renderFoodRow() {
    var foods = unlockedFoods();
    if (selectedFoodIndex >= foods.length) selectedFoodIndex = foods.length - 1;
    foodRow.innerHTML = "";
    for (var i = 0; i < foods.length; i++) {
      (function (food, idx) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "food-btn" + (idx === selectedFoodIndex ? " selected" : "");
        btn.textContent = food.e;
        btn.title = food.n + " をえらぶ";
        btn.setAttribute("aria-label", food.n + " をえらぶ");
        btn.setAttribute("aria-pressed", idx === selectedFoodIndex ? "true" : "false");
        btn.disabled = cleared;
        btn.addEventListener("click", function () {
          selectedFoodIndex = idx;
          renderFoodRow();
        });
        foodRow.appendChild(btn);
      })(foods[i], i);
    }
  }

  function spawnFlyingFood(emoji) {
    var f = document.createElement("span");
    f.className = "flying-food";
    f.textContent = emoji;
    game.appendChild(f);
    f.addEventListener("animationend", function () { f.remove(); });
  }

  function bounceAnimal() {
    animalEl.classList.remove("bounce");
    void animalEl.offsetWidth;
    animalEl.classList.add("bounce");
  }

  function showToast(text) {
    var existing = game.querySelectorAll(".level-up-toast");
    for (var i = 0; i < existing.length; i++) existing[i].remove();

    var toast = document.createElement("div");
    toast.className = "level-up-toast";
    toast.innerHTML = text;
    game.appendChild(toast);
    toast.addEventListener("animationend", function () { toast.remove(); });
  }

  function spawnConfetti() {
    var pieces = ["🎉", "✨", "🏆", "⭐", "🎊"];
    for (var i = 0; i < 26; i++) {
      (function (i) {
        var el = document.createElement("span");
        el.className = "confetti";
        el.textContent = pieces[i % pieces.length];
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = (2 + Math.random() * 1.5) + "s";
        el.style.animationDelay = (Math.random() * .4) + "s";
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 4000);
      })(i);
    }
  }

  function showClear() {
    cleared = true;
    clearStatsEl.textContent = "さいしゅう Lv." + level + " / えさをあげた かいすう " + totalFeeds + " かい";
    clearOverlay.hidden = false;
    spawnConfetti();
  }

  function feed(foodEmoji) {
    if (cleared) return;

    totalFeeds++;
    feedsInEncounter++;
    spawnFlyingFood(foodEmoji);
    bounceAnimal();

    if (feedsInEncounter >= feedsNeededForLevel(level)) {
      var wasNew = currentIsNew;
      if (wasNew) {
        collected[currentIndex] = true;
        collectedCount++;
      }
      level++;

      if (isCleared()) {
        cleared = true;
        render();
        setTimeout(showClear, 500);
        return;
      }

      var unlockedFood = null;
      for (var i = 0; i < FOODS.length; i++) {
        if (FOODS[i].lv === level) { unlockedFood = FOODS[i]; break; }
      }
      var toastText = "Lv." + level + " に なった!";
      if (unlockedFood) {
        toastText += "<br>" + unlockedFood.e + " " + unlockedFood.n + " が つかえるように!";
      }
      showToast(toastText);

      startEncounter();
    }

    render();
  }

  function renderZukan() {
    zukanCount.textContent = collectedCount + " / " + ANIMALS.length + " しゅうしゅう";
    var html = "";
    for (var i = 0; i < ANIMALS.length; i++) {
      if (collected[i]) {
        html += '<div class="zukan-cell collected" title="' + ANIMALS[i].n + '">' + ANIMALS[i].e + '</div>';
      } else {
        html += '<div class="zukan-cell locked">?</div>';
      }
    }
    zukanGrid.innerHTML = html;
  }

  function reset() {
    level = 1;
    totalFeeds = 0;
    collected = {};
    collectedCount = 0;
    cleared = false;
    selectedFoodIndex = 0;
    clearOverlay.hidden = true;
    startEncounter();
    render();
  }

  zukanBtn.addEventListener("click", function () {
    renderZukan();
    zukanOverlay.hidden = false;
  });
  zukanClose.addEventListener("click", function () {
    zukanOverlay.hidden = true;
  });
  restartBtn.addEventListener("click", reset);
  feedActionBtn.addEventListener("click", function () {
    feed(getSelectedFoodEmoji());
  });
  window.addEventListener("keydown", function (e) {
    if (cleared || zukanOverlay.hidden === false) return;
    if (e.key === "x" || e.key === "X") {
      feed(getSelectedFoodEmoji());
    }
  });

  startEncounter();
  render();
})();
</script>
</body>
</html>
