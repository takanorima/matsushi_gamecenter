<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>動物育成ゲーム</title>
<style>
  :root {
    --main: #a7c6ff;
    --sub: #cbf0ff;
    --ink: #2a2840;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    font-family: "Hiragino Sans", "Yu Gothic Medium", "Noto Sans JP", sans-serif;
    background: linear-gradient(180deg, var(--sub) 0%, var(--main) 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }

  header {
    width: 100%;
    max-width: 26rem;
    display: flex;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.9rem 1rem 0;
  }

  .badge {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 0.45rem 0.8rem;
    font-size: 0.85rem;
    line-height: 1.3;
    box-shadow: 2px 2px 0 rgba(42,40,64,0.15);
  }
  .badge b {
    display: block;
    font-size: 1rem;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 26rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
  }

  .stage {
    position: relative;
    width: min(70vw, 260px);
    height: min(70vw, 260px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #animal {
    font-size: min(38vw, 150px);
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(2px 4px 0 rgba(42,40,64,0.15));
    transition: transform 0.15s ease;
  }
  #animal.bounce { animation: bounce 0.35s ease; }
  @keyframes bounce {
    0% { transform: scale(1); }
    35% { transform: scale(1.18) rotate(-4deg); }
    70% { transform: scale(0.95) rotate(3deg); }
    100% { transform: scale(1); }
  }

  .food-fly {
    position: absolute;
    font-size: 2.2rem;
    left: 50%;
    top: 100%;
    pointer-events: none;
    animation: fly 0.5s ease-out forwards;
  }
  @keyframes fly {
    0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -140%) scale(0.4); opacity: 0; }
  }

  #animal-name {
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 0.2rem;
  }

  .progress-wrap {
    width: 100%;
    max-width: 18rem;
    text-align: center;
  }
  .progress-label {
    font-size: 0.85rem;
    margin-bottom: 0.35rem;
  }
  .progress-bar {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    height: 1.1rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #ff6b35;
    width: 0%;
    transition: width 0.25s ease;
  }

  footer {
    width: 100%;
    max-width: 26rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 1rem 1.4rem;
  }

  #feed-btn {
    font-family: inherit;
    font-size: 1.3rem;
    font-weight: bold;
    color: #fff;
    background: #ff6b35;
    border: none;
    border-radius: 999px;
    padding: 1rem 3rem;
    box-shadow: 0 4px 0 #c94f22;
    cursor: pointer;
  }
  #feed-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c94f22;
  }
  #feed-btn .key {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    border-radius: 6px;
    padding: 0 0.4rem;
    margin-right: 0.4rem;
    font-size: 1rem;
  }

  #restart-btn {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.5rem 1.4rem;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(42,40,64,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .overlay-card {
    background: #fff;
    border-radius: 18px;
    padding: 2rem 1.6rem;
    text-align: center;
    max-width: 20rem;
  }
  .overlay-card .emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 0.6rem;
  }
  .overlay-card h2 {
    margin: 0 0 0.6rem;
    font-size: 1.4rem;
  }
  .overlay-card p {
    margin: 0 0 1.2rem;
    font-size: 0.95rem;
    color: #55506f;
  }
</style>
</head>
<body>

<header>
  <div class="badge">キャラ<b id="badge-animal">🐭</b></div>
  <div class="badge">えさ<b id="badge-food">🧀</b></div>
</header>

<main>
  <div class="stage">
    <span id="animal">🐭</span>
  </div>
  <div id="animal-name">ねずみ</div>

  <div class="progress-wrap">
    <div class="progress-label">つぎのレベルまで あと <span id="remain">5</span> かい</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</main>

<footer>
  <button id="feed-btn" type="button"><span class="key">A</span>えさをあげる</button>
  <button id="restart-btn" type="button" hidden>さいしょから</button>
</footer>

<div class="overlay" id="clear-overlay" hidden>
  <div class="overlay-card">
    <span class="emoji">🦁</span>
    <h2>クリア！</h2>
    <p>ライオンまで そだてたね!<br>おめでとう!</p>
    <button id="clear-restart-btn" type="button">もういちど あそぶ</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // レベルごとの どうぶつ・えさ・レベルアップに必要なかいすう
  var LEVELS = [
    { animal: "🐭", name: "ねずみ",       food: "🧀", need: 5 },
    { animal: "🐹", name: "ハムスター",   food: "🌻", need: 6 },
    { animal: "🐰", name: "うさぎ",       food: "🥕", need: 7 },
    { animal: "🐱", name: "ねこ",         food: "🐟", need: 8 },
    { animal: "🐶", name: "いぬ",         food: "🦴", need: 9 },
    { animal: "🦁", name: "らいおん",     food: "🍖", need: 10 }
  ];

  var STORAGE_KEY = "animal-game-save-v1";

  var state = { level: 0, feedCount: 0, cleared: false };

  var el = {
    animal: document.getElementById("animal"),
    animalName: document.getElementById("animal-name"),
    badgeAnimal: document.getElementById("badge-animal"),
    badgeFood: document.getElementById("badge-food"),
    remain: document.getElementById("remain"),
    progressFill: document.getElementById("progress-fill"),
    feedBtn: document.getElementById("feed-btn"),
    restartBtn: document.getElementById("restart-btn"),
    clearOverlay: document.getElementById("clear-overlay"),
    clearRestartBtn: document.getElementById("clear-restart-btn"),
    stage: document.querySelector(".stage")
  };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (
        typeof saved.level === "number" &&
        saved.level >= 0 && saved.level < LEVELS.length &&
        typeof saved.feedCount === "number"
      ) {
        state.level = saved.level;
        state.feedCount = saved.feedCount;
        state.cleared = !!saved.cleared;
      }
    } catch (e) { /* こわれたデータは無視する */ }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* 保存できなくてもゲームは続けられる */ }
  }

  function render() {
    var lv = LEVELS[state.level];
    el.animal.textContent = lv.animal;
    el.animalName.textContent = lv.name;
    el.badgeAnimal.textContent = lv.animal;
    el.badgeFood.textContent = lv.food;

    if (state.cleared) {
      el.remain.textContent = "0";
      el.progressFill.style.width = "100%";
      el.feedBtn.hidden = true;
      el.restartBtn.hidden = false;
      el.clearOverlay.hidden = false;
    } else {
      var remain = lv.need - state.feedCount;
      el.remain.textContent = String(remain);
      el.progressFill.style.width = Math.round((state.feedCount / lv.need) * 100) + "%";
      el.feedBtn.hidden = false;
      el.restartBtn.hidden = true;
      el.clearOverlay.hidden = true;
    }
  }

  function spawnFoodFly(emoji) {
    var fly = document.createElement("span");
    fly.className = "food-fly";
    fly.textContent = emoji;
    fly.style.marginLeft = (Math.random() * 40 - 20) + "px";
    el.stage.appendChild(fly);
    fly.addEventListener("animationend", function () { fly.remove(); });
  }

  function bounceAnimal() {
    el.animal.classList.remove("bounce");
    // reflow させて再生させる
    void el.animal.offsetWidth;
    el.animal.classList.add("bounce");
  }

  function feed() {
    if (state.cleared) return;

    var lv = LEVELS[state.level];
    state.feedCount += 1;
    bounceAnimal();
    spawnFoodFly(lv.food);

    if (state.feedCount >= lv.need) {
      if (state.level < LEVELS.length - 1) {
        state.level += 1;
        state.feedCount = 0;
      } else {
        state.cleared = true;
      }
    }

    save();
    render();
  }

  function restart() {
    state.level = 0;
    state.feedCount = 0;
    state.cleared = false;
    save();
    render();
  }

  el.feedBtn.addEventListener("click", feed);
  el.restartBtn.addEventListener("click", restart);
  el.clearRestartBtn.addEventListener("click", restart);

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (e.key === "a" || e.key === "A") feed();
  });

  load();
  render();
})();
</script>
</body>
</html>
